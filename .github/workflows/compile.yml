name: Compile LaTeX and Publish

on:
  push:
    branches:
      - main

jobs:
  build-latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Metadata for LaTeX
        run: |
          cd src
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')
          GIT_MSG=$(git log -1 --format=%s | sed 's/[_#$&]/\\&/g')
          
          echo "\\newcommand{\\gitHash}{$GIT_HASH}" > git_info.tex
          echo "\\newcommand{\\gitDate}{$GIT_DATE}" >> git_info.tex
          echo "\\newcommand{\\gitMessage}{$GIT_MSG}" >> git_info.tex

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: src
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Compilation"
          files: src/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}