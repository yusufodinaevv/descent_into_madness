name: Compile LaTeX and Publish

on:
  push:
    branches:
      - main

jobs:
  build-latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Metadata for LaTeX
        run: |
          cd src
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')
          GIT_MSG=$(git log -1 --format=%s | tr -d '[\#$&_%]')

          cat << 'EOF_GIT' > git_info.tex
          \newcommand{\gitHash}{placeholder_hash}
          \newcommand{\gitDate}{placeholder_date}
          \newcommand{\gitMessage}{placeholder_msg}
          EOF_GIT

          sed -i "s/placeholder_hash/$GIT_HASH/" git_info.tex
          sed -i "s/placeholder_date/$GIT_DATE/" git_info.tex
          sed -i "s/placeholder_msg/$GIT_MSG/" git_info.tex

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: src
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Compilation"
          files: src/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}